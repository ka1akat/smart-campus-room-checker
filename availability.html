<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Campus – Single Room Availability (Practice 12)</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page">
      <main class="card">
        <header class="card-header">
          <h1>Room Availability Checker</h1>
          <p class="subtitle">Smart Campus &middot; Practice 12 &middot; code-based version</p>
        </header>

        <section class="room-info">
          <div class="info-row">
            <span class="info-label">Room</span>
            <span class="info-value" id="room-name"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Current time (fixed)</span>
            <span class="info-value" id="now-display"></span>
          </div>
        </section>

        <section class="bookings">
          <h2>Existing bookings (fictional)</h2>
          <ul id="bookings-list" class="bookings-list"></ul>
        </section>

        <section class="check-form">
          <h2>Check a time</h2>
          <div class="time-fields">
            <div class="field">
              <label for="start-time">Start time</label>
              <input type="time" id="start-time" value="11:30" />
            </div>
            <div class="field">
              <label for="duration">Duration (minutes, 1–120)</label>
              <input type="number" id="duration" value="60" step="1" inputmode="numeric" />
            </div>
          </div>
          <div class="field">
            <label for="room-status">Room status</label>
            <select id="room-status">
              <option value="open" selected>Open</option>
              <option value="blocked">Blocked</option>
            </select>
          </div>
          <button id="check-btn" type="button">Check availability</button>
        </section>

        <section id="result" class="result" hidden aria-live="polite">
          <span class="result-icon"></span>
          <div class="result-body">
            <h3 id="result-title"></h3>
            <p id="result-message"></p>
            <p id="result-code" class="result-code"></p>
          </div>
        </section>

        <p class="page-link"><a href="/index.html">&larr; Room catalog (Assignments 03–05)</a></p>
      </main>
    </div>
    <script type="module" src="/availability-main.js"></script>
  </body>
</html>
